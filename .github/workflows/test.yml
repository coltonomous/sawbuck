name: Test

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      - name: Create data directory for SQLite
        run: mkdir -p data

      - name: Push schema to test DB
        run: npx drizzle-kit push

      - run: npx vitest run
