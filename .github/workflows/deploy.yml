name: Deploy Sawbuck

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest

    services:
      postgres:
        image: pgvector/pgvector:pg16
        env:
          POSTGRES_DB: sawbuck_test
          POSTGRES_PASSWORD: test
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
        ports:
          - 5432:5432

    env:
      DATABASE_URL: postgresql://postgres:test@localhost:5432/sawbuck_test

    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Enable pgvector
        run: PGPASSWORD=test psql -h localhost -U postgres -d sawbuck_test -c "CREATE EXTENSION IF NOT EXISTS vector;"
      - name: Apply migrations (same as production boot)
        run: npm run db:migrate
      - name: Build client
        run: cd client && npx vite build
      - run: npx vitest run

  deploy:
    needs: test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: aws-actions/configure-aws-credentials@v6
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ${{ secrets.AWS_REGION }}

      - name: Get runner IP
        id: ip
        run: echo "addr=$(curl -s https://ifconfig.me)" >> "$GITHUB_OUTPUT"

      - name: Open SSH for runner
        run: |
          aws ec2 authorize-security-group-ingress \
            --group-id ${{ secrets.EC2_SG_ID }} \
            --protocol tcp --port 22 --cidr ${{ steps.ip.outputs.addr }}/32

      - name: Deploy to EC2
        env:
          BETTER_AUTH_SECRET: ${{ secrets.BETTER_AUTH_SECRET }}
          AWS_REGION: ${{ secrets.AWS_REGION }}
          AWS_ACCESS_KEY_ID: ${{ secrets.AWS_ACCESS_KEY_ID }}
          AWS_SECRET_ACCESS_KEY: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          GOOGLE_CLIENT_ID: ${{ secrets.GOOGLE_CLIENT_ID }}
          GOOGLE_CLIENT_SECRET: ${{ secrets.GOOGLE_CLIENT_SECRET }}
          FAL_KEY: ${{ secrets.FAL_KEY }}
          S3_BUCKET: ${{ secrets.S3_BUCKET }}
          VITE_CDN_DOMAIN: ${{ secrets.VITE_CDN_DOMAIN }}
          BRAVE_API_KEY: ${{ secrets.BRAVE_API_KEY }}
          BACKUP_S3_BUCKET: ${{ secrets.BACKUP_S3_BUCKET }}
        run: |
          echo "${{ secrets.EC2_SSH_KEY }}" > key.pem
          chmod 400 key.pem

          # GitHub secrets win over the server's .env so rotating one takes
          # effect on the next deploy. Unset secrets leave the server's value
          # alone. Values go through a file, not the heredoc below, so `$` and
          # quotes in a secret survive intact.
          (umask 077 && : > .env.deploy)
          for key in BETTER_AUTH_SECRET AWS_REGION AWS_ACCESS_KEY_ID AWS_SECRET_ACCESS_KEY \
                     GOOGLE_CLIENT_ID GOOGLE_CLIENT_SECRET FAL_KEY S3_BUCKET VITE_CDN_DOMAIN \
                     BRAVE_API_KEY BACKUP_S3_BUCKET; do
            if [ -n "${!key}" ]; then printf '%s=%s\n' "$key" "${!key}" >> .env.deploy; fi
          done

          rsync -avz --exclude node_modules --exclude .git --exclude .env --exclude data \
            -e "ssh -i key.pem -o StrictHostKeyChecking=no" \
            ./ ec2-user@${{ secrets.EC2_HOST }}:/opt/sawbuck/

          ssh -i key.pem -o StrictHostKeyChecking=no ec2-user@${{ secrets.EC2_HOST }} bash -s <<EOF
          set -e

          cd /opt/sawbuck

          bash scripts/merge-env.sh .env .env.deploy
          rm -f .env.deploy

          # Keep the running image as sawbuck-app:previous for rollback (see
          # drizzle/README.md). The prune below only removes dangling images, so
          # this tag survives; the image it was moved off becomes dangling and
          # is cleaned up.
          prev_image=\$(docker compose images -q app 2>/dev/null | head -1)
          if [ -n "\$prev_image" ]; then docker tag "\$prev_image" sawbuck-app:previous; fi

          # Stop containers before restarting Docker daemon to avoid restart: unless-stopped
          # racing against docker compose down and leaving orphaned container names
          echo "Stopping app container..."
          docker compose stop -t 30 app 2>/dev/null || true
          docker compose down --remove-orphans 2>/dev/null || true

          # Inject AWS credentials into Docker daemon for awslogs driver
          # (IMDS is unreachable from the daemon's log driver context)
          _ak=\$(grep '^AWS_ACCESS_KEY_ID=' .env | cut -d= -f2-)
          _sk=\$(grep '^AWS_SECRET_ACCESS_KEY=' .env | cut -d= -f2-)
          _rg=\$(grep '^AWS_REGION=' .env | cut -d= -f2-)
          sudo mkdir -p /etc/systemd/system/docker.service.d
          printf '[Service]\nEnvironment="AWS_ACCESS_KEY_ID=%s"\nEnvironment="AWS_SECRET_ACCESS_KEY=%s"\nEnvironment="AWS_REGION=%s"\n' "\$_ak" "\$_sk" "\$_rg" | sudo tee /etc/systemd/system/docker.service.d/aws.conf > /dev/null
          sudo systemctl daemon-reload
          sudo systemctl restart docker
          sleep 3

          # Reclaim disk: remove dangling images and build cache (keeps volumes
          # and the :previous rollback image)
          docker image prune -f
          docker builder prune -af 2>/dev/null || true

          docker compose build
          docker compose up -d

          # Wait for health check
          echo "Waiting for health check..."
          for i in \$(seq 1 45); do
            if curl -sf http://localhost:3001/health > /dev/null 2>&1; then
              echo "Health check passed"
              break
            fi
            sleep 2
          done

          if ! curl -sf http://localhost:3001/health > /dev/null 2>&1; then
            echo "Health check failed — check CloudWatch log group /sawbuck/app for details" && exit 1
          fi

          # Ingest RAG knowledge base
          echo "Ingesting RAG knowledge base..."
          docker compose exec -T app npx tsx scripts/ingest.ts --only products || echo "Product ingestion failed (non-fatal)"
          docker compose exec -T app npx tsx scripts/ingest.ts --only guides || echo "Guide ingestion failed (non-fatal)"

          echo "Deploy complete"
          EOF

          rm -f key.pem .env.deploy

      - name: Close SSH for runner
        if: always()
        run: |
          aws ec2 revoke-security-group-ingress \
            --group-id ${{ secrets.EC2_SG_ID }} \
            --protocol tcp --port 22 --cidr ${{ steps.ip.outputs.addr }}/32 \
            2>/dev/null || true
