name: Deploy Sawbuck

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest

    services:
      postgres:
        image: pgvector/pgvector:pg16
        env:
          POSTGRES_DB: sawbuck_test
          POSTGRES_PASSWORD: test
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
        ports:
          - 5432:5432

    env:
      DATABASE_URL: postgresql://postgres:test@localhost:5432/sawbuck_test

    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Push schema to test DB
        run: npx drizzle-kit push --force
      - name: Enable pgvector
        run: PGPASSWORD=test psql -h localhost -U postgres -d sawbuck_test -c "CREATE EXTENSION IF NOT EXISTS vector;"
      - name: Build client
        run: cd client && npx vite build
      - run: npx vitest run

  deploy:
    needs: test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: aws-actions/configure-aws-credentials@v6
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ${{ secrets.AWS_REGION }}

      - name: Get runner IP
        id: ip
        run: echo "addr=$(curl -s https://ifconfig.me)" >> "$GITHUB_OUTPUT"

      - name: Open SSH for runner
        run: |
          aws ec2 authorize-security-group-ingress \
            --group-id ${{ secrets.EC2_SG_ID }} \
            --protocol tcp --port 22 --cidr ${{ steps.ip.outputs.addr }}/32

      - name: Deploy to EC2
        run: |
          echo "${{ secrets.EC2_SSH_KEY }}" > key.pem
          chmod 400 key.pem

          rsync -avz --exclude node_modules --exclude .git --exclude .env --exclude data \
            -e "ssh -i key.pem -o StrictHostKeyChecking=no" \
            ./ ec2-user@${{ secrets.EC2_HOST }}:/opt/sawbuck/

          ssh -i key.pem -o StrictHostKeyChecking=no ec2-user@${{ secrets.EC2_HOST }} bash -s <<EOF
          set -e

          cd /opt/sawbuck

          # Ensure required env vars are in .env (won't overwrite existing values)
          grep -q '^BETTER_AUTH_SECRET=' .env 2>/dev/null || echo 'BETTER_AUTH_SECRET=${{ secrets.BETTER_AUTH_SECRET }}' >> .env
          grep -q '^BETTER_AUTH_URL=' .env 2>/dev/null || echo 'BETTER_AUTH_URL=${{ secrets.BETTER_AUTH_URL }}' >> .env
          grep -q '^AWS_REGION=' .env 2>/dev/null || echo 'AWS_REGION=${{ secrets.AWS_REGION }}' >> .env
          grep -q '^AWS_ACCESS_KEY_ID=' .env 2>/dev/null || echo 'AWS_ACCESS_KEY_ID=${{ secrets.AWS_ACCESS_KEY_ID }}' >> .env
          grep -q '^AWS_SECRET_ACCESS_KEY=' .env 2>/dev/null || echo 'AWS_SECRET_ACCESS_KEY=${{ secrets.AWS_SECRET_ACCESS_KEY }}' >> .env
          grep -q '^ADMIN_EMAIL=' .env 2>/dev/null || echo 'ADMIN_EMAIL=${{ secrets.ADMIN_EMAIL }}' >> .env
          grep -q '^GOOGLE_CLIENT_ID=' .env 2>/dev/null || echo 'GOOGLE_CLIENT_ID=${{ secrets.GOOGLE_CLIENT_ID }}' >> .env
          grep -q '^GOOGLE_CLIENT_SECRET=' .env 2>/dev/null || echo 'GOOGLE_CLIENT_SECRET=${{ secrets.GOOGLE_CLIENT_SECRET }}' >> .env
          grep -q '^FAL_KEY=' .env 2>/dev/null || echo 'FAL_KEY=${{ secrets.FAL_KEY }}' >> .env

          docker compose down --remove-orphans 2>/dev/null || true

          # Reclaim disk: remove all unused images and build cache (keeps volumes)
          docker image prune -af
          docker builder prune -af 2>/dev/null || true

          docker compose build
          docker compose up -d

          # Wait for health check
          echo "Waiting for health check..."
          for i in \$(seq 1 45); do
            if curl -sf http://localhost:3001/health > /dev/null 2>&1; then
              echo "Health check passed"
              break
            fi
            sleep 2
          done

          if ! curl -sf http://localhost:3001/health > /dev/null 2>&1; then
            echo "Health check failed" && docker compose logs --tail 50 && exit 1
          fi

          # Ingest RAG knowledge base
          echo "Ingesting RAG knowledge base..."
          docker compose exec -T app npx tsx scripts/ingest.ts --only products || echo "Product ingestion failed (non-fatal)"
          docker compose exec -T app npx tsx scripts/ingest.ts --only guides || echo "Guide ingestion failed (non-fatal)"

          echo "Deploy complete"
          EOF

          rm -f key.pem

      - name: Close SSH for runner
        if: always()
        run: |
          aws ec2 revoke-security-group-ingress \
            --group-id ${{ secrets.EC2_SG_ID }} \
            --protocol tcp --port 22 --cidr ${{ steps.ip.outputs.addr }}/32 \
            2>/dev/null || true
