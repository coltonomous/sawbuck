name: Deploy Sawbuck

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Create data directory for SQLite
        run: mkdir -p data
      - name: Push schema to test DB
        run: npx drizzle-kit push
      - run: npx vitest run

  deploy:
    needs: test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: aws-actions/configure-aws-credentials@v5
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: us-east-1

      - name: Get runner IP
        id: ip
        run: echo "addr=$(curl -s https://ifconfig.me)" >> "$GITHUB_OUTPUT"

      - name: Open SSH for runner
        run: |
          aws ec2 authorize-security-group-ingress \
            --group-id ${{ secrets.EC2_SG_ID }} \
            --protocol tcp --port 22 --cidr ${{ steps.ip.outputs.addr }}/32

      - name: Deploy to EC2
        run: |
          echo "${{ secrets.EC2_SSH_KEY }}" > key.pem
          chmod 400 key.pem

          rsync -avz --exclude node_modules --exclude .git --exclude .env \
            -e "ssh -i key.pem -o StrictHostKeyChecking=no" \
            ./ ec2-user@${{ secrets.EC2_HOST }}:/opt/sawbuck/

          ssh -i key.pem -o StrictHostKeyChecking=no ec2-user@${{ secrets.EC2_HOST }} bash -s <<EOF
          set -e

          cd /opt/sawbuck

          # Ensure auth env vars are in .env
          grep -q BETTER_AUTH_SECRET .env 2>/dev/null || echo 'BETTER_AUTH_SECRET=${{ secrets.BETTER_AUTH_SECRET }}' >> .env
          grep -q BETTER_AUTH_URL .env 2>/dev/null || echo 'BETTER_AUTH_URL=${{ secrets.BETTER_AUTH_URL }}' >> .env
          grep -q ADMIN_EMAIL .env 2>/dev/null || echo 'ADMIN_EMAIL=${{ secrets.ADMIN_EMAIL }}' >> .env
          docker compose down --remove-orphans 2>/dev/null || true

          # One-time: remove stale DB left by previous failed deploy
          # TODO: remove this line after first successful deploy
          sudo rm -f data/sawbuck.db data/sawbuck.db-wal data/sawbuck.db-shm

          docker compose build
          docker compose up -d

          # Clean up old dangling images (previous builds), keep cache
          docker image prune -f

          # Wait for health check (first boot: migrations + admin seed + server start)
          echo "Waiting for health check..."
          for i in \$(seq 1 45); do
            if curl -sf http://localhost:3001/health > /dev/null 2>&1; then
              echo "Health check passed"
              break
            fi
            sleep 2
          done

          if ! curl -sf http://localhost:3001/health > /dev/null 2>&1; then
            echo "Health check failed" && docker compose logs --tail 50 && exit 1
          fi

          # Re-ingest RAG knowledge base (products + guides from sources.json)
          echo "Ingesting RAG knowledge base..."
          docker compose exec -T app npx tsx scripts/ingest.ts --only products || echo "Product ingestion failed (non-fatal)"
          docker compose exec -T app npx tsx scripts/ingest.ts --only guides || echo "Guide ingestion failed (non-fatal)"
          docker compose exec -T app npx tsx scripts/ingest.ts --stats || echo "Stats check failed (non-fatal)"

          echo "Deploy complete"
          EOF

          rm -f key.pem

      - name: Close SSH for runner
        if: always()
        run: |
          aws ec2 revoke-security-group-ingress \
            --group-id ${{ secrets.EC2_SG_ID }} \
            --protocol tcp --port 22 --cidr ${{ steps.ip.outputs.addr }}/32 \
            2>/dev/null || true
