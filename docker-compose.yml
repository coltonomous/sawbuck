services:
  postgres:
    image: pgvector/pgvector:pg16
    environment:
      POSTGRES_DB: sawbuck
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-sawbuck}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    ports:
      - "5432:5432"
    restart: unless-stopped
    logging:
      driver: awslogs
      options:
        awslogs-region: ${AWS_REGION:-us-west-2}
        awslogs-group: /sawbuck/postgres
        awslogs-create-group: "true"

  app:
    build: .
    ports:
      - "3001:3001"
    env_file:
      - .env
    environment:
      - NODE_ENV=production
      - DATABASE_URL=postgresql://postgres:${POSTGRES_PASSWORD:-sawbuck}@postgres:5432/sawbuck
    depends_on:
      - postgres
    restart: unless-stopped
    logging:
      driver: awslogs
      options:
        awslogs-region: ${AWS_REGION:-us-west-2}
        awslogs-group: /sawbuck/app
        awslogs-create-group: "true"

volumes:
  postgres_data:
