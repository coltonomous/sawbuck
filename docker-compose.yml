services:
  postgres:
    image: pgvector/pgvector:pg16
    environment:
      POSTGRES_DB: sawbuck
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-sawbuck}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    ports:
      - "5432:5432"
    restart: unless-stopped
    logging:
      driver: awslogs
      options:
        awslogs-region: ${AWS_REGION:-us-west-2}
        awslogs-group: /sawbuck/postgres
        awslogs-create-group: "true"

  app:
    build:
      context: .
      args:
        VITE_CDN_DOMAIN: ${VITE_CDN_DOMAIN:-}
    ports:
      - "3001:3001"
    env_file:
      - .env
    environment:
      - NODE_ENV=production
      - DATABASE_URL=postgresql://postgres:${POSTGRES_PASSWORD:-sawbuck}@postgres:5432/sawbuck
    depends_on:
      - postgres
    restart: unless-stopped
    logging:
      driver: awslogs
      options:
        awslogs-region: ${AWS_REGION:-us-west-2}
        awslogs-group: /sawbuck/app
        awslogs-create-group: "true"

  backup:
    image: postgres:16-alpine
    depends_on:
      - postgres
    environment:
      - BACKUP_S3_BUCKET=${BACKUP_S3_BUCKET:-}
      - BACKUP_S3_PREFIX=${BACKUP_S3_PREFIX:-sawbuck/db}
      - BACKUP_INTERVAL_HOURS=${BACKUP_INTERVAL_HOURS:-24}
      - BACKUP_RETENTION_DAYS=${BACKUP_RETENTION_DAYS:-14}
      - PGHOST=postgres
      - PGUSER=postgres
      - PGDATABASE=sawbuck
      - POSTGRES_PASSWORD=${POSTGRES_PASSWORD:-sawbuck}
      - AWS_REGION=${AWS_REGION:-us-west-2}
      - AWS_ACCESS_KEY_ID=${AWS_ACCESS_KEY_ID:-}
      - AWS_SECRET_ACCESS_KEY=${AWS_SECRET_ACCESS_KEY:-}
    volumes:
      - ./scripts/backup-db.sh:/usr/local/bin/backup-db.sh:ro
    entrypoint: ["/bin/sh", "/usr/local/bin/backup-db.sh"]
    # on-failure so an unset BACKUP_S3_BUCKET (script exits 0) won't thrash
    restart: on-failure:5
    logging:
      driver: awslogs
      options:
        awslogs-region: ${AWS_REGION:-us-west-2}
        awslogs-group: /sawbuck/backup
        awslogs-create-group: "true"

volumes:
  postgres_data:
